name: Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the scripts
        run: |
          bash -n rootfs/usr/local/bin/firewall-start
          bash -n rootfs/usr/local/bin/firewall-rules
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck rootfs/usr/local/bin/*
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: container-firewall:test
          build-args: IMAGE_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          set -u
          # A server on the Docker network, listening on 8080 and 9090.
          docker run -d --name server --entrypoint bash container-firewall:test -c '
            socat TCP-LISTEN:8080,fork,reuseaddr SYSTEM:"echo ok" &
            exec socat TCP-LISTEN:9090,fork,reuseaddr SYSTEM:"echo ok"'
          server=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' server)

          start() {
            docker rm -f firewall protected > /dev/null 2>&1 || true
            mkdir -p config && printf "$1" > config/network
            docker run -d --name firewall --cap-add NET_ADMIN \
              -v "$PWD/config:/config:ro" container-firewall:test
            for _ in $(seq 30); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' firewall)" = healthy ] && break
              sleep 1
            done
            docker logs firewall
            docker run -d --name protected --network container:firewall \
              --entrypoint sleep container-firewall:test infinity
          }
          reachable() {
            docker exec protected timeout 5 bash -c "exec 3<>/dev/tcp/$1/$2"
          }
          blocked() {
            if reachable "$@"; then echo "$1:$2 should be blocked"; return 1; fi
          }

          start "internet off\nallow $server tcp 8080\n"
          reachable 127.0.0.1 9999
          reachable "$server" 8080
          blocked "$server" 9090
          blocked 1.1.1.1 443
          # The protected container cannot change the rules.
          if docker exec protected nft flush ruleset; then exit 1; fi
          reachable "$server" 8080
          blocked 1.1.1.1 443
          # The health process keeps no privilege.
          docker exec firewall sh -c 'grep -q "^CapEff:\s*0*$" /proc/$(pgrep -x socat | head -1)/status'

          start "internet on\n"
          reachable 1.1.1.1 443
          blocked "$server" 8080

          start "ipv4 off\ninternet on\n"
          reachable 127.0.0.1 9999
          blocked 1.1.1.1 443

          # An invalid configuration leaves the firewall closed and unhealthy.
          docker rm -f firewall protected
          printf 'internet maybe\n' > config/network
          docker run -d --name firewall --cap-add NET_ADMIN -v "$PWD/config:/config:ro" container-firewall:test
          sleep 5
          docker logs firewall 2>&1 | grep -q 'rules not applied'
          test "$(docker inspect -f '{{.State.Running}}' firewall)" = false

          # Without NET_ADMIN, it refuses to start.
          docker rm -f firewall
          printf 'internet on\n' > config/network
          docker run -d --name firewall -v "$PWD/config:/config:ro" container-firewall:test
          sleep 5
          docker logs firewall 2>&1 | grep -q 'NET_ADMIN'
          docker rm -f firewall server
      - name: Push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: IMAGE_VERSION=${{ github.sha }}
          cache-from: type=gha
